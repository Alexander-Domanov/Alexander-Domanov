<svg viewBox="0 0 900 250" width="900" height="250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="animated profile sheet"><rect width="900" height="250" fill="#0e2035"/><rect width="900" height="250" fill="url(#g)" class="grid"/><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#16304d" stroke-width="1"/></pattern></defs><style>
    .frame { stroke-dasharray: 460; stroke-dashoffset: 460;
              animation: draw 1.1s ease-out .1s both; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .grid { opacity: 0; animation: fade .9s ease .5s both; }
    @keyframes fade { to { opacity: 1; } }
    .rise { opacity: 0; transform: translateY(6px);
             animation: rise .5s ease both; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .reveal { animation: type 1.3s steps(46, end) 1.15s both; }
    @keyframes type { from { transform: translateX(-560px); } }
    .draw-x { transform-origin: 28px 0; transform: scaleX(1);
               animation: drawx .5s ease both; }
    @keyframes drawx { from { transform: scaleX(0); } }
    .stamp { opacity: 0; animation: stamp .3s ease both; }
    @keyframes stamp { from { opacity: 0; transform: scale(.94); }
                        to { opacity: 1; transform: scale(1); } }
    .caret { animation: blink 1.05s steps(1, end) 2.4s infinite both; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .scan { animation: scan 9s linear 3s infinite; }
    @keyframes scan { 0% { transform: translateY(0); }
                       100% { transform: translateY(228px); } }
