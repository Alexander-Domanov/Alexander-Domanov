name: Refresh profile figures

# Redraws every image used by README.md from public GitHub data.
#
# Why it is built this way:
#   * no third-party widget services — the previous profile loaded avatars,
#     trophies and graphs from several external deployments, and most of them
#     are dead now (402 DEPLOYMENT_DISABLED), which left broken frames on the
#     profile. Everything on this page is generated here instead.
#   * stdlib Python only — there is no dependency to rot.
#   * the job commits only when the rendered files actually differ, so the
#     repository never fills up with empty daily commits.

on:
  schedule:
    - cron: "17 5 * * *" # daily, off the hour to avoid the runner rush
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-figures
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate figures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/profile_svg.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/out; then
            echo "figures are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/out
          git commit -m "chore(profile): refresh generated figures [skip ci]"
          git push
