name: room

# Комната профиля: вид зависит от времени суток, поэтому картинку перерисовывает
# воркер, а не человек. Имя файла несёт версию (хеш содержимого), README
# получает новое имя — иначе кэш картинок держит старую комнату.
#
# Почему так:
#   * картинка рисуется здесь же, stdlib Python, без чужих сервисов;
#   * коммит только когда комната правда изменилась (четыре раза в сутки, не
#     каждый час);
#   * ветка profile/blueprint-readme едет за main: проверка пункта 1 сверяет
#     README главной ветки с README этой ветки, и расхождение краснеет.

on:
  schedule:
    - cron: "7 * * * *" # каждый час: комната смотрит на часы Минска
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: room
  cancel-in-progress: true

jobs:
  room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: без неё push ветки витрины отклоняется «fetch first».
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the room for the current hour
        run: python3 scripts/room.py --remote --all-moments

      - name: Commit when the room changed
        run: |
          if [ -z "$(git status --porcelain -- assets/room README.md)" ]; then
            echo "the room is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/room README.md
          git commit -m "chore(room): redraw the room for this hour [skip ci]"
          git push origin HEAD:main
          # Ветка витрины обязана ехать за main: проверка пункта 1 сверяет их
          # README. Берём ветку из origin явно, иначе push спотыкается.
          git fetch --no-tags origin main profile/blueprint-readme
          git push origin HEAD:profile/blueprint-readme
